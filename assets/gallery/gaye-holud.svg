<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="haldiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E1423"/>
      <stop offset="60%" stop-color="#4A0E18"/>
      <stop offset="100%" stop-color="#2A1810"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#haldiGrad)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#E3A94C" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#E3A94C" stroke-width="0.8" stroke-dasharray="4,4" stroke-opacity="0.3"/>
  <!-- Decorative Haldi Yellow Floral Backdrop -->
  <g opacity="0.15">
    <circle cx="200" cy="280" r="140" fill="#E3A94C"/>
    <circle cx="600" cy="280" r="140" fill="#E3A94C"/>
    <circle cx="400" cy="260" r="180" fill="#E3A94C"/>
  </g>
  <!-- Brass Urlis / Bowls with Marigolds and Water -->
  <ellipse cx="400" cy="460" rx="140" ry="40" fill="#C98A2B" stroke="#E3A94C" stroke-width="3"/>
  <ellipse cx="400" cy="455" rx="130" ry="32" fill="#E3A94C" fill-opacity="0.85"/>
  <!-- Floating Marigold blossoms -->
  <circle cx="360" cy="455" r="12" fill="#C98A2B"/>
  <circle cx="390" cy="450" r="14" fill="#6E1423"/>
  <circle cx="420" cy="456" r="13" fill="#C98A2B"/>
  <circle cx="450" cy="452" r="11" fill="#6E1423"/>
  <circle cx="330" cy="458" r="10" fill="#E3A94C"/>
  <circle cx="475" cy="457" r="10" fill="#E3A94C"/>
  <!-- Traditional Bengali Kulo (Painted Winnowing Fan) -->
  <path d="M340 340 C340 250 460 250 460 340 L440 370 L360 370 Z" fill="#E3A94C" stroke="#6E1423" stroke-width="2.5"/>
  <circle cx="400" cy="300" r="22" fill="#6E1423"/>
  <path d="M385 300 Q400 280 415 300 Q400 320 385 300 Z" fill="#FBF4E8"/>
  <!-- Marigold hanging streams -->
  <path d="M120 160 Q400 280 680 160" fill="none" stroke="#E3A94C" stroke-width="7" stroke-dasharray="16,8"/>
  <path d="M160 180 Q400 310 640 180" fill="none" stroke="#C98A2B" stroke-width="6" stroke-dasharray="14,7"/>
  <!-- Side brass lanterns -->
  <rect x="200" y="380" width="24" height="40" fill="#C98A2B" rx="3"/>
  <rect x="576" y="380" width="24" height="40" fill="#C98A2B" rx="3"/>
  <polygon points="212,360 200,380 224,380" fill="#E3A94C"/>
  <polygon points="588,360 576,380 600,380" fill="#E3A94C"/>
  <!-- Titles -->
  <text x="400" y="80" text-anchor="middle" fill="#FBF4E8" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" letter-spacing="1">Gaye Holud Floral Pavilion</text>
  <text x="400" y="105" text-anchor="middle" fill="#E3A94C" font-family="'Hind Siliguri', sans-serif" font-size="13" letter-spacing="0.5">Salt Lake Open Courtyard • Haldi</text>
</svg>