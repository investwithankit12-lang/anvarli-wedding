<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="annivBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E18"/>
      <stop offset="60%" stop-color="#300B13"/>
      <stop offset="100%" stop-color="#1B060B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#annivBg)"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C98A2B" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#C98A2B" stroke-width="0.8" stroke-dasharray="4,4" stroke-opacity="0.3"/>
  <!-- Candlelit Banquet Atmosphere -->
  <g transform="translate(400, 360)">
    <!-- Elegant Table -->
    <ellipse cx="0" cy="80" rx="260" ry="40" fill="#2A1810" stroke="#C98A2B" stroke-width="2"/>
    <ellipse cx="0" cy="74" rx="250" ry="34" fill="#FBF4E8" fill-opacity="0.9"/>
    <!-- Candelabra -->
    <path d="M-60 40 L-60 -30 M-60 -10 Q-30 0 0 10 Q30 0 60 -10 L60 -30 M0 70 L0 -50" stroke="#C98A2B" stroke-width="3" fill="none"/>
    <ellipse cx="0" cy="70" rx="20" ry="6" fill="#E3A94C"/>
    <!-- Candle flames -->
    <ellipse cx="-60" cy="-38" rx="4" ry="9" fill="#E3A94C"/>
    <ellipse cx="0" cy="-58" rx="4" ry="10" fill="#E3A94C"/>
    <ellipse cx="60" cy="-38" rx="4" ry="9" fill="#E3A94C"/>
    <!-- Warm glow rings -->
    <circle cx="0" cy="-58" r="28" fill="#E3A94C" opacity="0.18"/>
    <circle cx="-60" cy="-38" r="22" fill="#E3A94C" opacity="0.15"/>
    <circle cx="60" cy="-38" r="22" fill="#E3A94C" opacity="0.15"/>
    <!-- Floral runner -->
    <path d="M-200 80 Q0 60 200 80" stroke="#6E1423" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-190 78 Q0 58 190 78" stroke="#E3A94C" stroke-width="4" stroke-dasharray="8,6" fill="none"/>
  </g>
  <text x="400" y="80" text-anchor="middle" fill="#FBF4E8" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" letter-spacing="1">Intimate Milestone Celebration</text>
  <text x="400" y="105" text-anchor="middle" fill="#E3A94C" font-family="'Hind Siliguri', sans-serif" font-size="13" letter-spacing="0.5">Victoria Terraces • 50th Anniversary Gala</text>
</svg>